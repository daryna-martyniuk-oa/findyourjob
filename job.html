<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вакансія — FindYourJob</title>
    <meta name="description" content="Детальна інформація про вакансію." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Вакансія — FindYourJob" />
    <meta property="og:description" content="Детальна інформація про вакансію." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script>
      try {
        var saved = localStorage.getItem('findyourjob:theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <script type="module" src="/src/entries/job.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти до основного вмісту</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="index.html">
          <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="10.8" cy="10.8" r="6.6" />
            <path d="m15.7 15.7 5 5" />
          </svg>
          FindYourJob
        </a>
        <nav aria-label="Основна навігація">
          <ul class="nav-list" role="list">
            <li><a href="index.html">Головна</a></li>
            <li><a href="jobs.html">Вакансії</a></li>
            <li>
              <a href="jobs.html?saved=1"
                >Збережені <span class="count" id="saved-count" hidden>0</span></a
              >
            </li>
          </ul>
        </nav>
        <button type="button" id="theme-toggle" class="btn btn--ghost" aria-pressed="false">
          Темна тема
        </button>
      </div>
    </header>
    <main id="main" class="container section" tabindex="-1">
      <nav class="breadcrumb" aria-label="Навігаційний ланцюжок">
        <ol role="list">
          <li><a href="index.html">Головна</a></li>
          <li><a href="jobs.html">Вакансії</a></li>
          <li aria-current="page"><span id="crumb-current">Вакансія</span></li>
        </ol>
      </nav>
      <div id="job-root" aria-live="polite" aria-busy="true"></div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>
          Дані вакансій надає
          <a href="https://jobicy.com" target="_blank" rel="noopener noreferrer"
            >Jobicy<span class="visually-hidden"> (відкриється в новій вкладці)</span></a
          >. Кожна вакансія має посилання на оригінал.
        </p>
      </div>
    </footer>
  </body>
</html>
